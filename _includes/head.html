<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<meta name="keywords" content="{{ site.keywords | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">

<!-- Open Graph -->
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
<meta property="og:type" content="website">
<meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
{% if site.featured-image %}<meta property="og:image" content="{{ site.featured-image | absolute_url }}">{% endif %}
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">

<script type="application/ld+json">{ "@context":"https://schema.org", "@type":"Person", "name":"{{ site.author.name | escape }}", "affiliation":{"@type":"Organization","name":"{{ site.author.employer | escape }}"}, "email":"{{ site.author.email }}", "url":"{{ site.url }}"{% if site.featured-image %}, "image":"{{ site.featured-image | absolute_url }}"{% endif %} }</script>

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% if site.noindex or page.noindex %}<meta name="robots" content="noindex">{% endif %}
{% if jekyll.environment == "production" and site.google-analytics-id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google-analytics-id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google-analytics-id }}');
</script>
{% endif %}
