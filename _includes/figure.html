{% comment %}
    Figure include.
    Options:
    - "img"     filename inside /images/, or a full URL
    - "alt"     alt text describing the image
    - "caption" optional caption text
    - "width"   optional CSS width, e.g. "300px" or "50%"
    - "class"   optional extra class, e.g. "align-right" or "align-left"
{% endcomment %}
<figure class="{% if include.class %}{{ include.class }}{% endif %}"{% if include.width %} style="width:{{ include.width }};"{% endif %}>
    <img src="{% if include.img contains '//' %}{{ include.img }}{% else %}{{ include.img | prepend: '/images/' | relative_url }}{% endif %}" alt="{{ include.alt }}" loading="lazy">
    {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
