<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <a class="site-title" href="{{ '/' | relative_url }}">{% if site.masthead_title %}{{ site.masthead_title }}{% else %}{{ site.title }}{% endif %}</a>
        <button class="greedy-nav__toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav-links">
          <span class="navicon"></span>
        </button>
        <ul class="visible-links" id="site-nav-links">
          {% for link in site.data.navigation.main %}
          <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}"{% if page.url contains link.url %} class="is--active" aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
