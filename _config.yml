#########
#
# Personal academic website for Raquel Centeno
#
# Styled after the academicpages template
# (https://github.com/academicpages/academicpages.github.io), which is
# itself derived from Minimal Mistakes by Michael Rose. Layouts,
# includes, and CSS all live in this repository -- no theme gem needed.
#
#########

#######
# SITE SETTINGS
#
title: "Raquel Centeno, Ph.D."
# shorter title used in the masthead (falls back to title if blank)
masthead_title: "Raquel Centeno"
description: "The personal website for Raquel Centeno, Postdoctoral Teaching Scholar at the Caltech Linde Center for Science, Society, and Policy."
keywords: "political science, Raquel Centeno, political behavior, public opinion, affective polarization, identity politics, American politics, electoral systems, election science"
# featured-image is used for social media sharing cards
featured-image: "/images/centeno_headshot.jpg"
source-code: "https://github.com/racenteno/racenteno.github.io"
pub_year: 2025

#######
# AUTHOR SIDEBAR
#
# Everything here renders in the left-hand author profile.
# Leave a field blank (or delete it) to hide that link.
#
author:
  name: "Raquel Centeno"
  avatar: "/images/centeno_headshot.jpg"
  bio: "Political scientist studying public opinion and political behavior in American politics."
  employer: "Caltech"
  email: "centeno@caltech.edu"
  # TODO: paste your full Google Scholar profile URL, e.g.
  # https://scholar.google.com/citations?user=XXXXXXXXXXXX
  #googlescholar: ""
  orcid: "https://orcid.org/0000-0001-7529-0469"
  # TODO: your Bluesky handle only, e.g. racenteno.bsky.social
  bluesky: "rcenteno.bsky.social"
  github: "racenteno"

#######
# CV
#
# Stable link used by the CV page and the sidebar button.
cv_url: "https://www.dropbox.com/scl/fi/v4ljjgroin0bwm67c9imb/centeno_cv.pdf?rlkey=dz8q0sdn70hh73daujz7v3n4g&st=zd4t7dkv&dl=0"

##########
# URL VARIABLES
#
url: https://racenteno.github.io
baseurl:

##########
# GOOGLE ANALYTICS [optional]
#
# google-analytics-id: G-NC3PPY2JZB

##########
# ROBOTS EXCLUDE [optional]
#
# noindex: true

#######
# BUILD SETTINGS
#
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true

include: ["_pages"]
exclude: [README.md, LICENSE, .Rhistory, .DS_Store]
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
